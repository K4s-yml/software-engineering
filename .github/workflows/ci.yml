name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project_week_12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project_week_12/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
